[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/beeld/*"
  to = "/.netlify/functions/beeld/:splat"
  status = 200

# Pagina's die (nog) niet vooraf zijn opgebouwd, zoals nieuwe werken uit /beheer
[[redirects]]
  from = "/en/*"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/beheer"
  [headers.values]
    X-Robots-Tag = "noindex"
